<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صلاة</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
  body { background: #000; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 20px; line-height: 2.2; }
.container { max-width: 750px; margin: 0 auto; }
  h1 { color: #ff4444; text-align: center; font-weight: 900; font-size: 30px; text-shadow: 0 0 15px #ff4444; margin-bottom: 20px; }
.back-link { display: inline-block; color: #ff4444; text-decoration: none; margin-bottom: 20px; font-weight: 700; font-size: 18px; }
.content {
    background: rgba(15, 15, 15, 0.9);
    border: 1px solid #ff4444;
    border-radius: 15px;
    padding: 30px;
    font-size: 20px;
    box-shadow: 0 0 25px rgba(255, 68, 68, 0.3);
  }
.title { color: #ff4444; font-size: 24px; font-weight: 900; margin: 25px 0 15px 0; text-align: center; border-bottom: 1px solid #ff4444; padding-bottom: 10px; }
.red { color: #ff4444; font-weight: 700; }
.text { margin: 15px 0; color: #ddd; }
.loading { text-align: center; color: #ff4444; font-size: 20px; }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← الرجوع للسواعي</a>
  <h1 id="title">جار التحميل...</h1>
  <div class="content" id="content"><div class="loading">جار تحميل الصلاة...</div></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const h = params.get('h') || 'boker';

fetch('./prayers.json')
.then(r => r.json())
.then(prayers => {
    const prayer = prayers[h];
    if(!prayer) {
      document.getElementById('content').innerHTML = "لم توجد هذه الصلاة";
      return;
    }

    document.getElementById('title').textContent = prayer.name;

    let html = '';
    prayer.content.forEach(item => {
      if(item.type === 'title') html += `<div class="title">${item.text}</div>`;
      if(item.type === 'red') html += `<div class="red">${item.text}</div>`;
      if(item.type === 'text') html += `<div class="text">${item.text}</div>`;
    });

    document.getElementById('content').innerHTML = html;
  })
.catch(() => {
    document.getElementById('content').innerHTML = "خطأ في تحميل الملف. تأكد من وجود prayers.json";
  });
</script>
</body>
</html>
